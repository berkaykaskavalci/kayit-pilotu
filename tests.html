<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Kayıt Pilotu — engine tests</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 1rem; margin: 18px 0 4px; }
    ul { list-style: none; padding: 0; margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    .pass::before { content: "PASS  "; font-weight: 700; color: #1d6b45; }
    .fail::before { content: "FAIL  "; font-weight: 700; color: #a3282d; }
    .fail { font-weight: 700; }
    #summary { font: 700 1.1rem ui-monospace, Menlo, Consolas, monospace; margin-top: 20px; padding: 10px 12px; border: 2px solid currentColor; border-radius: 8px; }
    @media (prefers-color-scheme: dark) { .pass::before { color: #7fd3a4; } .fail::before { color: #f29a9a; } }
  </style>
</head>
<body>
  <h1>Kayıt Pilotu — engine and data tests</h1>
  <p>Runs in the browser against <code>js/engine.js</code> and <code>js/data.js</code>. <a href="index.html">Back to the app</a></p>
  <div id="out"></div>
  <p id="summary">Running…</p>

  <script type="module">
    import * as E from './js/engine.js';
    import { NAMES_EN, titleCaseEn, DATA, SEMESTERS, SEMESTER_ECTS, SECTIONS, COURSE_MAP, PREREQS, ELECTIVES, SAMPLE, RULES, DEMO_STUDENT } from './js/data.js';
    import { STR } from './js/i18n.js';
    import * as U from './js/util.js';
    import * as A from './js/attendance.js';
    import * as G from './js/grades.js';
    import * as C from './js/calendar.js';
    import * as I from './js/ics.js';
    import * as M from './js/importer.js';
    import * as K from './js/catalog.js';
    import * as P from './js/plan.js';
    import * as R from './js/roadmap.js';
    import { CALENDAR, CLASS_TERM } from './js/data-extra.js';

    const results = [];
    let section = '';
    const group = (name) => { section = name; };
    const ok = (cond, name, extra = '') => results.push({ section, name: name + (cond || !extra ? '' : '  -> ' + extra), pass: !!cond });
    const eq = (a, b, name) => ok(JSON.stringify(a) === JSON.stringify(b), name, `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);

    const sec = (code, no) => SECTIONS.find((s) => s.course === code && s.no === no);
    const items = (codes, pins) => E.buildItems(codes, DATA, pins);
    const emptyProfile = () => ({ status: {}, cgpa: null, semestersCompleted: 0, graduating: false });
    const sample = () => JSON.parse(JSON.stringify(SAMPLE.profile));

    try {
      // ------------------------------------------------------------------
      group('Data integrity');
      eq(SEMESTERS.map((s) => s.courses.reduce((n, c) => n + c.ects, 0)), [30, 30, 30, 30, 30, 30, 31, 29], 'semester ECTS totals are 30,30,30,30,30,30,31,29');
      ok(SEMESTERS.every((s) => s.courses.reduce((n, c) => n + c.ects, 0) === SEMESTER_ECTS[s.n]), 'each semester total matches the heading in SOURCE_DATA.md');
      eq(SEMESTERS.reduce((n, s) => n + s.ects, 0), 240, 'curriculum totals 240 ECTS');
      eq(SEMESTERS.map((s) => s.courses.length), [6, 7, 8, 7, 6, 5, 7, 5], 'course count per semester');
      eq(ELECTIVES.length, 22, 'department elective pool has 22 courses');
      ok(SECTIONS.every((s) => COURSE_MAP[s.course]), 'every section belongs to a known course', SECTIONS.filter((s) => !COURSE_MAP[s.course]).map((s) => s.course).join(','));
      ok(SECTIONS.every((s) => s.slots.length > 0 && s.slots.every((x) => Number.isInteger(x.d) && x.d >= 0 && x.d <= 6 && Number.isInteger(x.h) && x.h >= E.FIRST_HOUR && x.h <= E.LAST_HOUR)), 'every slot has a valid day (0-6) and hour (8-21)');
      ok(SECTIONS.every((s) => new Set(s.slots.map((x) => x.d * 100 + x.h)).size === s.slots.length), 'no section lists the same slot twice');
      ok(SECTIONS.every((s) => s.cap > 0 && s.room.length > 0), 'every section has a room and a room capacity');
      eq(new Set(SECTIONS.map((s) => s.course + '/' + s.no)).size, SECTIONS.length, 'section numbers are unique per course');
      eq(SECTIONS.length, 109, 'section count matches the source (109 section lines)');
      eq(DATA.sectionsByCourse.PHYS1121.length, 17, 'PHYS1121 has 17 sections');
      eq(DATA.sectionsByCourse.MATH1131.length, 8, 'MATH1131 has 8 sections');
      ok(Object.keys(PREREQS).every((c) => COURSE_MAP[c]), 'every course with a prerequisite exists');
      eq(Object.keys(PREREQS).length, 16, '16 courses have prerequisites');
      ok(sec('TURK1110', 1).online && !sec('ME3220', 1).online, 'rooms starting with X are flagged online');
      eq(sec('ENGR2120', 3).room, 'T(-2 B14)', 'room names containing brackets are parsed');
      ok(COURSE_MAP.SOFL1101.sectionsNotLoaded && !DATA.sectionsByCourse.SOFL1101, 'SOFL1101 is flagged "sections not loaded" and has no invented sections');
      ok(COURSE_MAP.ME4830.noTimetable && E.isOffered(COURSE_MAP.ME4830, DATA), 'ME4830 (internship) is offered without timetable slots');
      eq(COURSE_MAP.ESE4240.name, null, 'ESE4240 has no invented name');
      ok(RULES.every((r) => r.art && r.en && r.tr), 'every rule has an article number and both languages');

      // ------------------------------------------------------------------
      group('Prerequisites (OR groups joined by AND)');
      const pre = (code, passed) => E.evalPrereq(code, new Set(passed), PREREQS);
      ok(!pre('ME3510', []).ok, 'ME3510 blocked with nothing passed');
      eq(pre('ME3510', []).missing.length, 2, 'ME3510 with nothing passed reports both missing groups');
      ok(!pre('ME3510', ['ME2210']).ok, 'ME3510 blocked with only ME2210 (MATH2263 missing)');
      eq(pre('ME3510', ['ME2210']).missing, [['MATH2263']], 'ME3510 with ME2210 reports exactly MATH2263 as missing');
      ok(!pre('ME3510', ['MATH2263']).ok, 'ME3510 blocked with only MATH2263 (mechanics missing)');
      eq(pre('ME3510', ['MATH2263']).missing, [['ME1222', 'ME2211', 'CE2203', 'ME2210']], 'the missing mechanics group lists all alternatives');
      ok(pre('ME3510', ['ME2210', 'MATH2263']).ok, 'ME3510 open with ME2210 and MATH2263');
      ok(pre('ME3510', ['CE2203', 'MATH2263']).ok, 'ME3510 open with old equivalent CE2203 and MATH2263');
      ok(pre('MATH1132', ['MATH131']).ok && !pre('MATH1132', []).ok, 'MATH1132 accepts old code MATH131, blocked without');
      ok(pre('ME4230', ['MATH2263', 'ME3220']).ok && !pre('ME4230', ['ME3220']).ok, 'ME4230 needs MATH2263 and (ME2222 or ME3220)');
      ok(pre('ME4410', ['CHEM1130', 'ME2220']).ok && !pre('ME4410', ['CHEM1130']).ok, 'ME4410 needs chemistry and mechanics of materials');
      ok(pre('ENGR3450', []).ok, 'a course without prerequisites is always open');

      // ------------------------------------------------------------------
      group('CGPA bands and ECTS limits');
      eq(E.cgpaBand(2.0, 4), 'high', 'CGPA 2.00 is in the 40 ECTS band');
      eq(E.cgpaBand(3.4, 4), 'high', 'CGPA 3.40 is in the 40 ECTS band');
      eq(E.cgpaBand(1.99, 4), 'normal', 'CGPA 1.99 is in the normal band');
      eq(E.cgpaBand(1.2, 1), 'normal', 'first two semesters use the normal band');
      eq(E.cgpaBand(null, 4), 'normal', 'missing CGPA uses the normal band');
      const maxFor = (cgpa, sem = 4) => E.ectsLimits({ cgpa, semestersCompleted: sem }).max;
      eq(maxFor(2.0), 40, 'CGPA 2.00 -> 40 ECTS');
      eq(maxFor(2.5), 40, 'CGPA 2.50 -> 40 ECTS');
      eq(maxFor(1.99), 32, 'CGPA 1.99 -> 32 ECTS');
      eq(maxFor(1.75), 32, 'CGPA 1.75 -> 32 ECTS');
      eq(maxFor(1.74), 32, 'CGPA 1.74 -> 32 ECTS');
      eq(maxFor(1.0), 32, 'CGPA 1.00 -> 32 ECTS');
      eq(maxFor(null), 32, 'no CGPA entered -> 32 ECTS');
      eq(maxFor(1.0, 1), 32, 'first-year student -> 32 ECTS');
      eq(maxFor(null, 0), 32, 'first-semester student without CGPA -> 32 ECTS');
      eq(maxFor(2.5, 0), 40, 'CGPA 2.50 -> 40 ECTS even when semesters completed is left at 0');
      eq(E.ectsLimits({ cgpa: 2.5, semestersCompleted: 4 }).article, '23', 'CGPA 2.00 or above cites Art. 23');
      eq(E.ectsLimits({ cgpa: 1.5, semestersCompleted: 4 }).reason, null, 'CGPA below 2.00 needs no extra hint');
      eq(E.ectsLimits({ cgpa: null, semestersCompleted: 4 }).reason, 'noCgpa', 'no CGPA -> hint to enter it');
      eq(E.ectsLimits({ cgpa: null, semestersCompleted: 1 }).reason, 'noCgpa', 'early semesters without CGPA -> hint to enter it');
      ok(!('newMax' in E.ectsLimits({ cgpa: 1.5, semestersCompleted: 4 })), 'there is no new-course sub-limit any more');
      eq(E.ectsSummary(['MATH2263', 'ME3220'], sample(), DATA), { total: 12 }, 'ECTS summary adds up the selected courses');

      // ------------------------------------------------------------------
      group('Overlap detection');
      ok(E.sectionsOverlap(sec('ME3220', 1), sec('ME4610', 1)), 'ME3220(1) and ME4610(1) overlap');
      eq(E.sharedSlots(sec('ME3220', 1).slots, sec('ME4610', 1).slots), [{ d: 1, h: 8 }, { d: 1, h: 9 }], 'they share Tue 08 and Tue 09');
      ok(E.sectionsOverlap(sec('ME3220', 1), sec('ESE4112', 1)), 'ME3220(1) and ESE4112(1) overlap');
      ok(!E.sectionsOverlap(sec('ME3220', 1), sec('ME3320', 1)), 'ME3220(1) and ME3320(1) do not overlap');
      ok(!E.sectionsOverlap(sec('ME3320', 1), sec('ME3420', 1)), 'back-to-back lessons (Fri 08-09 then 10-11) do not overlap');
      ok(E.sectionsOverlap(sec('TURK1110', 2), sec('HIST1110', 2)), 'online lessons at the same time still conflict (TURK1110(2) / HIST1110(2))');
      ok(E.masksOverlap(E.maskOf(sec('HIST1210', 1).slots), E.maskOf(sec('ISG9110', 1).slots)), 'HIST1210(1) and ISG9110(1) conflict (Wed 18-19, both online)');
      eq(E.mergeSlots(sec('ME3220', 1).slots), [{ d: 1, from: 8, to: 9 }, { d: 4, from: 12, to: 13 }], 'consecutive slots merge into ranges');
      eq([E.slotStart(8), E.slotEnd(9)], ['08:40', '10:30'], 'a lesson starts at hh:40 and ends at (hh+1):30');

      // ------------------------------------------------------------------
      group('Combination enumeration');
      eq(E.optionsFor('ENGR3450', DATA).length, 3, 'ENGR3450: sections 3 and 4 have the same times and merge into one option');
      eq(E.optionsFor('ME4910', DATA).length, 4, 'ME4910: 8 sections collapse to 4 distinct timetables');
      eq(E.enumeratePlans(items(['ME3220', 'ME3320', 'ME3420'])).total, 2, 'ME3220 + ME3320 + ME3420 has exactly 2 plans');
      const sampleItems = items(SAMPLE.selected);
      const sampleRes = E.enumeratePlans(sampleItems);
      eq(sampleRes.total, 4, 'sample selection (5 courses) has exactly 4 plans');
      eq(E.enumeratePlans(items(SAMPLE.selected, { ENGR3450: 4 })).total, 2, 'pinning ENGR3450 to section 4 leaves 2 plans');
      eq(E.enumeratePlans(items(['MATH2263', 'ME3420'])).total, 2, 'MATH2263 + ME3420: sections 2 and 4 of MATH2263 are excluded');

      const conflictFree = (its, plan) => {
        const seen = new Set();
        for (let i = 0; i < its.length; i++) for (const s of its[i].options[plan[i]].slots) {
          const k = s.d * 100 + s.h;
          if (seen.has(k)) return false;
          seen.add(k);
        }
        return true;
      };
      ok(sampleRes.plans.every((p) => conflictFree(sampleItems, p)), 'every returned plan is really conflict-free');

      // brute force over raw sections to cross-check the backtracking
      const brute = (codes) => {
        const lists = codes.map((c) => E.optionsFor(c, DATA));
        let n = 0;
        const go = (i, chosen) => {
          if (i === lists.length) { n++; return; }
          for (const o of lists[i]) if (chosen.every((p) => !E.masksOverlap(p.mask, o.mask))) go(i + 1, [...chosen, o]);
        };
        go(0, []);
        return n;
      };
      const y1 = ['PHYS1121', 'MATH1131', 'ENGR1115', 'MATH1100'];
      const y1Items = items(y1);
      const t0 = Date.now();
      const y1Res = E.enumeratePlans(y1Items);
      const ms = Date.now() - t0;
      eq(y1Res.total, brute(y1), 'PHYS1121 (17) x MATH1131 (8) x ENGR1115 x MATH1100: backtracking count equals brute force');
      ok(y1Res.total > 0 && y1Res.plans.every((p) => conflictFree(y1Items, p)), `all ${y1Res.total} first-year plans are conflict-free`);
      ok(ms < 1500, `first-year enumeration is fast (${ms} ms)`);
      const full = items(['PHYS1121', 'MATH1131', 'ENGR1115', 'MATH1100', 'UMFD1020', 'TURK1110', 'HIST1110']);
      const t1 = Date.now();
      const fullRes = E.searchPlans(full, E.DEFAULT_PREFS, { keep: 200 });
      const ms2 = Date.now() - t1;
      ok(fullRes.total > 0 && fullRes.best.length <= 200, `7 first-year courses: ${fullRes.total} plans counted, best 200 kept`);
      ok(ms2 < 4000, `ranked search over 7 courses stays fast (${ms2} ms)`);
      eq(fullRes.total, E.countPlans(full), 'searchPlans and countPlans agree on the total');

      // ------------------------------------------------------------------
      group('Ranking');
      const ranked = E.rankPlans(y1Items, y1Res.plans, { fewDays: false, lateStart: true, fewGaps: false, freeWeekend: false });
      ok(ranked[0].metrics.early === Math.min(...ranked.map((r) => r.metrics.early)), '"no lessons before 10:40" puts a plan with the fewest early lessons first');
      const byDays = E.rankPlans(y1Items, y1Res.plans, { fewDays: true, lateStart: false, fewGaps: false, freeWeekend: false });
      ok(byDays[0].metrics.campusDays === Math.min(...byDays.map((r) => r.metrics.campusDays)), '"fewest days on campus" puts a plan with the fewest campus days first');
      const byGaps = E.rankPlans(y1Items, y1Res.plans, { fewDays: false, lateStart: false, fewGaps: true, freeWeekend: false });
      ok(byGaps[0].metrics.gaps === Math.min(...byGaps.map((r) => r.metrics.gaps)), '"fewest idle gaps" puts a plan with the fewest idle hours first');
      const top = E.searchPlans(y1Items, { fewDays: true, lateStart: false, fewGaps: false, freeWeekend: false }, { keep: 5 });
      eq(top.best[0].cost, byDays[0].cost, 'searchPlans (top-k) finds the same best cost as a full sort');
      const m = E.planMetrics(items(['ME3220']), [0]);
      eq([m.days, m.campusDays, m.early, m.gaps, m.weekendDays, m.first, m.last], [2, 2, 2, 0, 0, 8, 13], 'metrics of ME3220(1): 2 days, 2 early lessons, no gaps');
      eq(E.planMetrics(items(['TURK1110']), [0]).campusDays, 0, 'online-only days are not counted as days on campus');
      const w = E.searchPlans(items(['ME4910']), { fewDays: false, lateStart: false, fewGaps: false, freeWeekend: true });
      eq(w.best[0].metrics.weekendDays, 1, 'ME4910 always uses one weekend day (reported, not hidden)');

      // ------------------------------------------------------------------
      group('No-solution explanation');
      const a = items(['ME3220', 'ME4610']);
      eq(E.enumeratePlans(a).total, 0, 'ME3220 + ME4610 has no conflict-free plan');
      const exA = E.explainNoSolution(a, { keep: { ME3220: 2, ME4610: 1 } });
      eq(exA.pairs.map((p) => [p.a, p.b]), [['ME3220', 'ME4610']], 'the clashing pair ME3220 / ME4610 is named');
      eq(exA.pairs[0].shared, [{ d: 1, h: 8 }, { d: 1, h: 9 }], 'the shared slots are Tue 08 and Tue 09');
      eq(exA.recommended, 'ME4610', 'suggests dropping the elective ME4610 rather than compulsory ME3220');
      eq(exA.plansAfter, 1, 'reports how many plans remain after the drop');
      const b = items(['ME3220', 'ESE4112', 'ME3320']);
      const exB = E.explainNoSolution(b, { keep: { ME3220: 2, ESE4112: 1, ME3320: 2 } });
      eq(exB.pairs.map((p) => [p.a, p.b]), [['ME3220', 'ESE4112']], 'ME3220 / ESE4112 named, uninvolved ME3320 is not');
      eq(exB.singleDrops, ['ESE4112', 'ME3220'], 'only the two clashing courses are offered as drops, elective first');
      const c3 = items(['ME3220', 'ME4610', 'ESE4112']);
      const exC = E.explainNoSolution(c3, {});
      eq(exC.pairs.length, 3, 'ME3220 / ME4610 / ESE4112: all three pairs clash (Tue 08-09)');
      eq(exC.singleDrops, [], 'no single drop is enough for three mutually clashing courses');
      eq(exC.pairDrops.length, 3, 'pairs of drops are proposed instead');
      const pinned = items(['MATH2263', 'ME3420'], { MATH2263: 2 });
      eq(E.enumeratePlans(pinned).total, 0, 'pinning MATH2263(2) next to ME3420 leaves no plan');
      ok(E.explainNoSolution(pinned, { unpinned: items(['MATH2263', 'ME3420']) }).pinsBlame, 'the explanation blames the pinned section');
      const multi = items(['HIST1210', 'ISG9110']);
      ok(E.explainNoSolution(multi).pairs.length === 1, 'two single-section online courses at the same time are reported as a clash');

      // ------------------------------------------------------------------
      group('Classification for this term');
      const cls = E.classify(sample(), DATA);
      eq(cls.MATH2263.cat, 'repeat', 'sample: failed compulsory MATH2263 is "must repeat first"');
      eq(cls.EEE3718.cat, 'blocked', 'sample: EEE3718 is blocked');
      eq(cls.EEE3718.missing, [['MATH2263', 'MATH263']], 'sample: EEE3718 names MATH2263 as the missing prerequisite');
      eq(cls.ME3220.cat, 'eligible', 'sample: ME3220 is eligible');
      eq(cls.ME2220.cat, 'passed', 'sample: ME2220 is already passed');
      eq(cls.ME3410.cat, 'notOffered', 'sample: ME3410 is not offered this term');
      eq(cls.ME4330.cat, 'blocked', 'sample: elective ME4330 is blocked (needs ME3330)');
      eq(cls.ME4830.cat, 'eligible', 'sample: internship ME4830 is eligible (ISG9110 passed)');
      eq(cls.ELECTMEA1.cat, 'slot', 'elective slots are reported as slots, not as courses');
      const cls0 = E.classify(emptyProfile(), DATA);
      eq(cls0.SOFL1101.cat, 'noData', 'empty profile: SOFL1101 is "sections not loaded"');
      eq(cls0.SOFL1102.cat, 'blocked', 'empty profile: SOFL1102 is blocked by SOFL1101');
      eq(cls0.MATH1131.cat, 'eligible', 'empty profile: MATH1131 is eligible');
      eq(cls0.MATH1132.cat, 'blocked', 'empty profile: MATH1132 is blocked by MATH1131');
      const failedElective = sample();
      failedElective.status.ME4610 = 'failed';
      eq(E.classify(failedElective, DATA).ME4610.cat, 'eligible', 'a failed elective is not forced into "must repeat"');
      ok(DATA.courses.every((c) => cls[c.code] && cls[c.code].cat), 'every course gets a category');

      // ------------------------------------------------------------------
      group('Pre-flight check');
      const run = (selected, profile, feasible = true) => Object.fromEntries(E.preflight({ selected, profile, data: DATA, feasible }).map((c) => [c.id, c]));
      const good = run(SAMPLE.selected, sample());
      eq(Object.values(good).map((c) => c.state), ['pass', 'pass', 'pass', 'pass', 'pass'], 'sample plan passes all five checks');
      eq(Object.values(good).map((c) => c.article), ['29(3)', '28(c)', '23', '26', '22(1)'], 'each check cites its article');
      const noRepeat = run(['ME3220', 'ME3320', 'ME3420', 'ENGR3450'], sample());
      eq(noRepeat.repeat.state, 'fail', 'leaving out failed MATH2263 fails the repeat-first check');
      eq(noRepeat.repeat.missingRepeats, ['MATH2263'], 'and names MATH2263');
      eq(run(['ME3220'], sample()).min.state, 'fail', '5 ECTS fails the 20 ECTS minimum');
      const grad = sample();
      grad.graduating = true;
      eq([run(['ME3220'], grad).min.state, run(['ME3220'], grad).min.exceptionUsed], ['pass', true], 'graduating student: minimum does not apply');
      eq(run(['ME3220', 'ME4610'], sample(), false).overlap.state, 'fail', 'an infeasible selection fails the overlap check');
      eq(run(['EEE3718'], sample()).prereq.state, 'fail', 'a course with a missing prerequisite fails the prerequisite check');
      const low = sample();
      low.cgpa = 1.8;
      eq(run(['MATH2263', 'ME3220', 'ME3320', 'ME3420', 'ENGR3450', 'UFND7010'], low).ects.state, 'pass', 'CGPA 1.80: 28 ECTS is within the 32 ECTS limit');
      eq(run(['MATH2263', 'ME3220', 'ME3320', 'ME3420', 'ENGR3450'], low).ects.limits.max, 32, 'CGPA 1.80: limit is 32');
      const low2 = run(['MATH2263', 'ME3220', 'ME3320', 'ME3420', 'ENGR3450', 'UFND7010', 'ESE4212'], low);
      eq([low2.ects.sum.total, low2.ects.state, low2.ects.overTotal], [34, 'fail', true], 'CGPA 1.80: 34 ECTS breaks the 32 ECTS limit while 40 would have allowed it');
      eq(run(['MATH2263', 'ME3220', 'ME3320', 'ME3420', 'ENGR3450', 'UFND7010', 'ESE4212'], sample()).ects.state, 'pass', 'CGPA 2.41: the same 34 ECTS is fine (limit 40)');
      const noCgpa = sample();
      noCgpa.cgpa = null;
      eq(run(['ME3220'], noCgpa).ects.state, 'warn', 'no CGPA entered: ECTS check is a note, limit 32');
      const many = run(['MATH2263', 'ME3220', 'ME3320', 'ME3420', 'ENGR3450', 'ESE4212', 'ENGR4451', 'UFND7010', 'ME4830'], sample());
      eq([many.ects.sum.total, many.ects.state], [44, 'fail'], 'CGPA 2.41: 44 ECTS breaks the 40 ECTS limit');
      const sofl = emptyProfile();
      eq(run(['SOFL1101', 'MATH1131'], sofl).overlap.state, 'warn', 'a course without loaded sections turns the overlap check into a note, not a pass');

      // ------------------------------------------------------------------
      group('Registration helpers');
      eq(E.currentSemester(sample()), 5, 'sample student (4 semesters done) registers for semester 5');
      eq(E.currentSemester(emptyProfile()), 1, 'a new student registers for semester 1');
      eq(E.currentSemester({ semestersCompleted: 11 }), 8, 'past 8 semesters the curriculum ends at semester 8');
      const rp = E.registrationPlan(sample(), DATA);
      eq(rp.semester, 5, 'registration plan is for semester 5');
      eq(rp.locked, ['MATH2263'], 'failed MATH2263 is the only locked retake');
      eq(rp.auto, ['MATH2263', 'ENGR3450', 'ME3220', 'ME3320', 'ME3420'], 'retake first, then the offered compulsory courses of semester 5');
      eq(rp.rows.find((r) => r.code === 'MATH2263').role, 'retake', 'MATH2263 row is marked as a retake (alttan)');
      const eeeRow = rp.rows.find((r) => r.code === 'EEE3718');
      eq([eeeRow.state, eeeRow.missing], ['blocked', [['MATH2263', 'MATH263']]], 'EEE3718 is listed as blocked and names MATH2263');
      ok(!rp.rows.some((r) => r.code === 'UNVELECTME1'), 'elective slots are not listed as compulsory rows');
      ok(!rp.rows.some((r) => r.code === 'ME2220'), 'passed courses are not listed');
      const optCodes = rp.optional.map((o) => o.code);
      ok(['ENGR4451', 'ESE4112', 'ME4610'].every((c) => rp.optional.find((o) => o.code === c && o.group === 'elective' && o.cat === 'eligible')), 'offered department electives can be added');
      eq(rp.optional.find((o) => o.code === 'ME4330').cat, 'blocked', 'blocked elective ME4330 is listed as blocked, not addable');
      ok(!optCodes.includes('ME4110'), 'electives not offered this term are not listed');

      ok(Object.keys(imp.status).every((c) => COURSE_MAP[c]), 'only known codes get a status');
      const one = M.parseObsStatus('ENGR 1115\nPROGRAMLAMAYA GİRİŞ\nZ\n5\n[22-23G]\nSE 1115\nPROGRAMLAMAYA GİRİŞ\n6\nFF\nMATH 1100\nMATEMATİKSEL MANTIK\nZ\n5\nGenel Not Ort 2,05', DATA);
      eq([one.status.ENGR1115, one.counts.rows, one.counts.notTaken, one.cgpa], ['failed', 2, 1, 2.05], 'newline-separated cells: FF fails, row without term not taken, CGPA read');
      const pipes = M.parseObsStatus('ENGR 1115 | PROGRAMLAMAYA GİRİŞ | Z | 5 | [22-23G] | SE 1115 | PROGRAMLAMAYA GİRİŞ | 6 | D', DATA);
      eq(pipes.status, { ENGR1115: 'passed' }, 'the " | " separated format of the brief is parsed');
      const spaced = M.parseObsStatus('MATH 1131 ANALİZ I Z 7 [22-23G] MATH 1131 ANALİZ I 7 B-', DATA);
      eq(spaced.status, { MATH1131: 'passed' }, 'a row pasted as one space-separated line is parsed');
      const retake = M.parseObsStatus('PHYS 1121\tFİZİK I\tZ\t7\t[22-23G]\tPHYS 1121\tFİZİK I\t7\tF\nPHYS 1121\tFİZİK I\tZ\t7\t[23-24G]\tPHYS 1121\tFİZİK I\t7\tC', DATA);
      eq(retake.status.PHYS1121, 'passed', 'a failed course passed on a later attempt counts as passed');
      eq([M.gradeResult('d'), M.gradeResult('D+'), M.gradeResult('U'), M.gradeResult('NA'), M.gradeResult('W'), M.gradeResult('x')], ['passed', 'passed', 'failed', 'failed', 'failed', null], 'grade results');
      const empty = M.parseObsStatus('', DATA);
      eq([empty.counts.rows, empty.cgpa, empty.semesters], [0, null, 0], 'an empty paste gives an empty preview, not an error');
      eq(M.parseObsStatus('GANO 7,5', DATA).cgpa, null, 'a CGPA outside 0-4 is ignored');
      eq(M.normCode('UNV ELECT ME1'), 'UNVELECTME1', 'slot codes match the app codes');

      // ------------------------------------------------------------------
      group('Catalogue');
      eq(K.normalize('ANALİZ  II'), 'analiz ii', 'search is case- and accent-insensitive (Turkish İ)');
      eq(K.normalize('Işık Şüğö'), 'isik sugo', 'Turkish letters fold to ASCII for search');
      eq(K.unlocks('MATH2263', PREREQS).direct, ['EEE3718', 'ME3510', 'ME4230'], 'MATH 2263 directly unlocks EEE3718, ME3510, ME4230');
      eq(K.unlocks('ME2210', PREREQS).all, ['ME2220', 'ME3220', 'ME3510', 'ME3410', 'ME4120', 'ME4410', 'ME4230'], 'ME 2210 unlocks a chain (transitively, breadth first)');
      eq(K.unlocks('ME4910', PREREQS).all, ['ME4920'], 'ME 4910 unlocks ME 4920');
      eq(K.unlocks('ENGR3450', PREREQS).all, [], 'a course nothing depends on unlocks nothing');
      eq(K.requiresChain('ME4230', PREREQS, COURSE_MAP).map((x) => x.code), ['ME4230', 'MATH2263', 'MATH1131', 'ME3220', 'ME2210'].filter((c) => PREREQS[c]), 'ME 4230 needs MATH 2263 (needs MATH 1131) and ME 3220 (needs ME 2210)');
      const fc = (f) => K.filterCourses(DATA, sample(), f).map((c) => c.code);
      ok(fc({}).length === DATA.courses.filter((c) => c.kind !== 'slot').length, 'no filter: every course, elective slots left out');
      eq(fc({ q: 'diferansiyel' }), ['MATH2263'], 'search by Turkish name (without accents)');
      eq(fc({ q: 'thermo' }), ['ME2320'], 'search by English name');
      eq(fc({ q: 'me 3220' }), ['ME3220'], 'search by spaced code');
      eq(fc({ q: 'me3220' }), ['ME3220'], 'search by compact code');
      ok(fc({ hidePassed: true }).every((c) => sample().status[c] !== 'passed'), 'hide passed');
      ok(fc({ eligible: true, offered: true }).includes('ME3220') && !fc({ eligible: true }).includes('EEE3718'), 'eligible now: ME3220 yes, EEE3718 (needs MATH2263) no');
      eq(fc({ sem: '5', type: 'compulsory' }), ['EEE3718', 'ENGR3450', 'ME3220', 'ME3320', 'ME3420'], 'semester 5 compulsory courses');
      ok(fc({ type: 'elective' }).length === 22 && fc({ sem: 'pool' }).length === 22, 'elective filter and pool filter give the 22 pool courses');
      ok(!fc({ offered: true }).includes('ME3410') && fc({ offered: true }).includes('SOFL1101'), 'offered this term: ME3410 no; SOFL1101 yes (sections not loaded)');

      // ------------------------------------------------------------------
      group('Registration-day plan (alternatives, Plan B/C)');
      const rpS = E.registrationPlan(sample(), DATA);
      const codesS = E.composeSelection(rpS);
      const pa = P.planA(codesS, {}, DATA, E.DEFAULT_PREFS);
      ok(pa.ok && Object.keys(pa.sections).length === 5 && pa.source === 'filled', 'Plan A is completed by the exact search when no section is chosen');
      eq(E.chosenClashes(E.chosenSections(pa.sections, DATA)), [], 'Plan A has no clash');
      const pa2 = P.planA(codesS, { MATH2263: 3, ENGR3450: 4, ME3320: 1 }, DATA, E.DEFAULT_PREFS);
      eq([pa2.sections.MATH2263, pa2.sections.ENGR3450, pa2.sections.ME3320, pa2.source], [3, 4, 1, 'picks'], 'chosen sections are kept in Plan A');
      const pa3 = P.planA(codesS, { MATH2263: 2 }, DATA, E.DEFAULT_PREFS);
      eq(pa3.source, 'search', 'chosen sections that clash: Plan A falls back to the best plan');
      const A0 = { MATH2263: 3, ENGR3450: 4, ME3220: 1, ME3320: 1, ME3420: 1 };
      eq(E.chosenClashes(E.chosenSections(A0, DATA)), [], 'the Plan A used below is clash-free');
      const alt = (code, full = {}) => P.alternatives(code, A0, DATA, full).map((x) => x.no);
      eq(alt('ENGR3450'), [3, 2, 1].filter((no) => !E.masksOverlap(E.maskOf(sec('ENGR3450', no).slots), E.maskOf(['MATH2263', 'ME3220', 'ME3320', 'ME3420'].flatMap((c) => sec(c, A0[c]).slots)))), 'ENGR3450 alternatives = the other sections that fit the rest of Plan A, same times first, then larger rooms');
      eq(P.alternatives('ENGR3450', A0, DATA, {})[0].sameTime, true, 'section 3 of ENGR3450 has the same times as section 4 and is offered first');
      eq(alt('ME3220'), [], 'ME3220 has a single section: no alternative');
      eq(alt('ENGR3450', { ENGR3450: [3] }).includes(3), false, 'a section marked full is never suggested');
      const brute2 = (code, full) => DATA.sectionsByCourse[code].filter((s) => s.no !== A0[code] && !P.isFull(full, code, s.no) && Object.keys(A0).filter((c) => c !== code).every((c) => !E.sectionsOverlap(s, sec(c, A0[c])))).map((s) => s.no).sort();
      ok(Object.keys(A0).every((c) => JSON.stringify(alt(c).slice().sort()) === JSON.stringify(brute2(c, {}))), 'alternatives match a brute-force check for every course');
      const order = P.entryOrder(A0, DATA, {});
      ok(order.every((x, i) => i === 0 || order[i - 1].alternatives.length < x.alternatives.length || (order[i - 1].alternatives.length === x.alternatives.length && order[i - 1].cap <= x.cap)), 'entry order: fewest alternatives first, then smallest room');
      eq(order.filter((x) => x.alternatives.length === 0).map((x) => x.code).sort(), ['ME3220', 'ME3420'].concat(order.filter((x) => x.alternatives.length === 0 && !['ME3220', 'ME3420'].includes(x.code)).map((x) => x.code)).sort(), 'single-section courses come first (no alternative)');
      const rep = P.repairPlan(codesS, A0, DATA, { MATH2263: [3] }, E.DEFAULT_PREFS);
      ok(rep.ok && rep.sections.MATH2263 !== 3 && E.chosenClashes(E.chosenSections(rep.sections, DATA)).length === 0, 'repair: MATH2263(3) full -> a clash-free plan without it');
      ok(rep.changed.includes('MATH2263'), 'repair reports what changed');
      eq(P.repairPlan(codesS, A0, DATA, { ME3220: [1] }).blocked, ['ME3220'], 'every section of ME3220 full: the course is reported as blocked');
      const bk = P.backupPlans(codesS, A0, DATA, {}, E.DEFAULT_PREFS, 2);
      eq(bk.total, 4, 'the exact search behind Plan B/C counts the same 4 timetables');
      ok(bk.plans.length === 2 && bk.plans.every((p) => p.changed.length > 0 && E.chosenClashes(E.chosenSections(p.sections, DATA)).length === 0), 'Plan B and Plan C differ from Plan A and are clash-free');
      ok(JSON.stringify(bk.plans[0].sections) !== JSON.stringify(bk.plans[1].sections), 'Plan B and Plan C differ from each other');
      const bkFull = P.backupPlans(codesS, A0, DATA, { MATH2263: [1, 3] }, E.DEFAULT_PREFS, 2);
      ok(bkFull.plans.every((p) => ![1, 3].includes(p.sections.MATH2263)), 'Plan B/C never use a section marked full');
      eq(P.exhausted(['ME3220', 'MATH2263'], DATA, { ME3220: [1] }), ['ME3220'], 'exhausted lists courses with every section full');

      // ------------------------------------------------------------------
      group('Graduation roadmap and CGPA projection');
      eq([R.termOf(0), R.termOf(1), R.termOf(3)].map((x) => `${x.season} ${x.y1}-${x.y2}`), ['fall 2026-2027', 'spring 2026-2027', 'spring 2027-2028'], 'terms alternate fall / spring from Fall 2026-27');
      const road = R.earliestPlan(sample(), DATA, { gp: G.GP['C+'] });
      eq(road.remainingEcts, 128, 'sample student: 128 ECTS left (MATH2263 7 + UFND7010 1 + semesters 5-8)');
      eq(road.terms.length, 4, 'sample student: 4 terms');
      eq(road.graduation && `${road.graduation.season} ${road.graduation.y1}`, 'spring 2027', 'earliest graduation: Spring 2027-28');
      ok(road.proven && road.lowerBound === 4, 'the plan meets the lower bound (128 ECTS / 40), so it is provably the earliest under the assumptions');
      eq(road.unscheduled, [], 'everything gets scheduled');
      ok(road.terms[0].codes[0] === 'MATH2263', 'the retake comes first in the first term');
      const termOfCode = (c) => road.terms.findIndex((tm) => tm.codes.includes(c));
      ok(termOfCode('EEE3718') > termOfCode('MATH2263'), 'EEE3718 is planned after MATH2263 is passed (earlier term)');
      ok(termOfCode('ME4920') > termOfCode('ME4910'), 'ME4920 comes after ME4910');
      ok(road.terms.every((tm) => tm.ects <= tm.limit), 'no term goes over its ECTS limit');
      ok(road.terms.every((tm) => tm.codes.every((c) => R.offeredIn(R.remainingUnits(sample(), DATA).find((u) => u.code === c), tm.k, DATA))), 'every course is planned in a term in which it is offered');
      const allPlanned = road.terms.flatMap((tm) => tm.codes);
      eq(allPlanned.length, new Set(allPlanned).size, 'no course is planned twice');
      eq(road.terms.reduce((n, tm) => n + tm.ects, 0), 128, 'all remaining ECTS are planned');
      ok(road.terms.every((tm) => U.isNum(tm.cgpaAfter)), 'the projected CGPA is a number in every term');
      const low3 = sample();
      low3.cgpa = 1.6;
      const roadLow = R.earliestPlan(low3, DATA, { gp: G.GP.D });
      ok(roadLow.terms[0].limit === 32 && roadLow.terms[0].ects <= 32, 'CGPA 1.60: first term limited to 32 ECTS');
      const roadUnknown = R.earliestPlan({ ...sample(), cgpa: null }, DATA, { gp: G.GP.B });
      ok(roadUnknown.terms.every((tm) => tm.cgpaAfter === null && tm.limit === 32), 'no CGPA entered: no projection (not NaN), limit 32');
      const done = R.earliestPlan({ status: Object.fromEntries(DATA.semesters.flatMap((s) => s.courses.map((c) => [c.code, 'passed']))), cgpa: 3 }, DATA, {});
      ok(done.alreadyDone && done.terms.length === 0 && done.graduation === null, 'a student with everything passed has nothing left to plan');
      const fresh0 = R.earliestPlan(emptyProfile(), DATA, {});
      ok(fresh0.graduation && fresh0.terms.length >= 8, `a new student needs at least 8 terms (${fresh0.terms.length})`);
      eq(R.gradedEcts(sample(), DATA), 119, 'sample student has 119 graded ECTS (semesters 1-4 without UFND7010)');
      eq(U.round(R.cgpaAfter({ cgpa: 2, base: 100, termEcts: 30, retakeEcts: 0, gp: 3 }), 4), U.round(290 / 130, 4), 'CGPA after a term: (2×100 + 3×30) / 130');
      eq(U.round(R.cgpaAfter({ cgpa: 1.8, base: 100, termEcts: 30, retakeEcts: 6, gp: 2 }), 4), U.round(240 / 124, 4), 'a retake replaces the F without adding credits');
      eq(R.cgpaAfter({ cgpa: null, base: 100, termEcts: 30, retakeEcts: 0, gp: 3 }), null, 'unknown CGPA gives null, not NaN');
      const need = R.averageNeeded({ cgpa: 1.8, base: 100, termEcts: 30, retakeEcts: 0, target: 2 });
      eq([need.need, need.state], [2.67, 'reachable'], 'CGPA 1.80 over 100 ECTS: a 30-ECTS term average of 2.67 lifts it to 2.00');
      eq(R.letterAtLeast(2.67), 'B-', '2.67 means at least B- (2.70)');
      eq(R.averageNeeded({ cgpa: 1.0, base: 200, termEcts: 20, retakeEcts: 0 }).state, 'impossible', 'a target out of reach in one term says so');
      eq(R.averageNeeded({ cgpa: 3.0, base: 100, termEcts: 30, retakeEcts: 0 }).state, 'already', 'well above 2.00: any average keeps it');
      eq(R.averageNeeded({ cgpa: NaN, base: 100, termEcts: 30, retakeEcts: 0 }).state, 'unknown', 'NaN CGPA: unknown, not NaN');
      eq(R.averageNeeded({ cgpa: 2, base: 100, termEcts: 0, retakeEcts: 0 }).state, 'unknown', 'no ECTS planned: unknown, not a division by zero');

      // ------------------------------------------------------------------
      group('Interface texts (new pages)');
      const newPrefixes = ['nav.catalogue', 'nav.regday', 'nav.attendance', 'nav.grades', 'nav.calendar', 'nav.roadmap', 'nav.import', 'nav.compare'];
      ok(newPrefixes.every((k) => STR.en[k] && STR.tr[k]), 'every new page has a menu label in both languages');
      ok(Object.values(STR.en).concat(Object.values(STR.tr)).every((s) => typeof s === 'string' && !U.hasBadText(s)), 'no interface text contains NaN / undefined');
      ok(Object.keys(STR.en).every((k) => (STR.en[k].match(/\{\w+\}/g) || []).sort().join() === (STR.tr[k].match(/\{\w+\}/g) || []).sort().join()), 'English and Turkish texts use the same {placeholders}', Object.keys(STR.en).filter((k) => (STR.en[k].match(/\{\w+\}/g) || []).sort().join() !== (STR.tr[k].match(/\{\w+\}/g) || []).sort().join()).join(','));
    } catch (err) {
      results.push({ section: 'Runtime', name: 'tests threw: ' + (err && err.stack ? err.stack : err), pass: false });
    }

    // ------------------------------------------------------------------
    // Integration: the real app in a 375 px wide iframe. Every page in English and Turkish
    // must render, contain no NaN / undefined, and not scroll horizontally. The stored
    // state of this browser is backed up first and restored afterwards.
    if (typeof document !== 'undefined' && !new URLSearchParams(location.search).has('unit')) {
      const KEY = 'kayit-pilotu:v5';
      const ENT = 'kayit-pilotu:entered';
      let backup = null;
      let entBackup = null;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      try {
        backup = localStorage.getItem(KEY);
        entBackup = sessionStorage.getItem(ENT);
        localStorage.removeItem(KEY);
        sessionStorage.removeItem(ENT);
      } catch (e) { /* storage unavailable */ }
      const fr = document.createElement('iframe');
      fr.title = 'App smoke test';
      fr.style.cssText = 'width:375px;height:640px;border:1px solid #888;display:block;margin-top:16px';
      try {
        group('Whole app in a 375 px iframe (every page, EN and TR)');
        const loaded = new Promise((r) => { fr.onload = r; });
        fr.src = 'index.html?today=2026-10-23';
        document.body.appendChild(fr);
        await loaded;
        await sleep(400);
        const w = fr.contentWindow;
        const doc = fr.contentDocument;
        const errors = [];
        w.addEventListener('error', (e) => errors.push(String(e.message)));
        ok(!doc.getElementById('entry').hidden, 'the app opens on the entry screen (no credentials asked)');
        ok(doc.querySelector('[data-testid="entry-import"]'), 'the entry screen offers "Import my OBS data"');
        doc.querySelector('[data-testid="entry-login"]').click();
        await sleep(200);
        const views = ['home', 'catalogue', 'register', 'timetable', 'regday', 'attendance', 'grades', 'calendar', 'roadmap', 'status', 'import', 'compare', 'rules'];
        for (const lang of ['en', 'tr']) {
          doc.querySelector(`[data-testid="lang-${lang}"]`).click();
          await sleep(150);
          const bad = [];
          const wide = [];
          const wrong = [];
          for (const v of views) {
            w.location.hash = '#' + v;
            await sleep(220);
            const main = doc.getElementById('main');
            if (main.dataset.view !== v) wrong.push(v);
            const text = main.innerText + ' ' + doc.getElementById('nav').innerText + ' ' + doc.title;
            if (U.hasBadText(text)) bad.push(v + ': ' + (text.match(/.{0,25}(NaN|undefined|\[object Object\]|Infinity|\bnull\b).{0,25}/) || [''])[0]);
            if (doc.documentElement.scrollWidth > w.innerWidth + 1) wide.push(`${v} (${doc.documentElement.scrollWidth}px)`);
          }
          eq(wrong, [], `${lang.toUpperCase()}: every page renders`);
          eq(bad, [], `${lang.toUpperCase()}: no NaN / undefined / null on any page`);
          eq(wide, [], `${lang.toUpperCase()}: no horizontal page scroll at 375 px on any page`);
        }
        doc.querySelector('[data-testid="lang-en"]').click();
        const st = w.kpDemo.state();
        eq([st.selected.length, st.today, st.lang], [5, '2026-10-23', 'en'], 'kpDemo.state() works: 5 courses, ?today honoured');
        eq(I.validateIcs(w.kpDemo.icsText()), [], 'the calendar page exports a valid .ics file');
        w.location.hash = '#home';
        await sleep(200);
        ok(doc.querySelectorAll('[data-testid^="attention-item-"]').length >= 3, 'dashboard "Needs your attention" is filled from real state');
        ok(doc.querySelector('[data-testid="attention-item-retake"]') && doc.querySelector('[data-testid="attention-item-cal-hol-republic"]'), 'it lists the retake and the Republic Day break (5 days after 23 Oct)');
        eq(doc.querySelector('[data-testid="dash-graduation"]').textContent, 'Spring 2027-28', 'dashboard shows the earliest graduation');
        w.location.hash = '#grades';
        await sleep(200);
        ok(doc.querySelector('[data-testid="grade-need-ME3320"]') && doc.querySelector('[data-testid="grades-demo-tag"]'), 'grades page shows final targets and labels the demo values');
        w.location.hash = '#attendance';
        await sleep(200);
        eq(doc.querySelector('[data-testid="att-badge-ME3420"]').dataset.state, 'last', 'attendance: ME3420 practice 5 of 5.6 h is "at the limit" (demo data)');
        ok(doc.querySelector('[data-testid="attendance-demo-tag"]'), 'attendance labels the demo values');
        eq(errors, [], 'no script errors while visiting every page');
      } catch (err) {
        results.push({ section: 'Runtime', name: 'integration threw: ' + (err && err.stack ? err.stack : err), pass: false });
      } finally {
        fr.remove();
        try {
          if (backup === null) localStorage.removeItem(KEY);
          else localStorage.setItem(KEY, backup);
          if (entBackup === null) sessionStorage.removeItem(ENT);
          else sessionStorage.setItem(ENT, entBackup);
        } catch (e) { /* ignore */ }
      }
    }

    const failed = results.filter((r) => !r.pass).length;
    const summary = failed ? `TESTS FAILED: ${failed}` : 'ALL TESTS PASSED';
    if (typeof document !== 'undefined') {
      const out = document.getElementById('out');
      let cur = null;
      let list = null;
      for (const r of results) {
        if (r.section !== cur) {
          cur = r.section;
          const h = document.createElement('h2');
          h.textContent = cur;
          out.appendChild(h);
          list = document.createElement('ul');
          out.appendChild(list);
        }
        const li = document.createElement('li');
        li.className = r.pass ? 'pass' : 'fail';
        li.textContent = r.name;
        list.appendChild(li);
      }
      document.getElementById('summary').textContent = `${summary}  (${results.length - failed} of ${results.length} assertions passed)`;
      document.title = summary;
    } else {
      for (const r of results) print((r.pass ? 'PASS  ' : 'FAIL  ') + '[' + r.section + '] ' + r.name);
      print(summary);
    }
  </script>
</body>
</html>
