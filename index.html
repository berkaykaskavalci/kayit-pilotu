<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Kayıt Pilotu / Registration Pilot: an unofficial pre-registration planner for course registration.">
  <title>Kayıt Pilotu — Registration Pilot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" id="skip" href="#main" data-act="skip">Skip to content</a>

  <header class="top">
    <div class="wrap top-in">
      <div class="brand">
        <span class="logo" aria-hidden="true">KP</span>
        <div>
          <h1>Kayıt Pilotu <span class="brand-sub">Registration Pilot</span></h1>
          <p id="tagline" class="tagline">Plan your course registration before it opens. Unofficial student project.</p>
        </div>
      </div>
      <div class="lang" id="langgroup" role="group" aria-label="Language">
        <button type="button" data-act="lang" data-lang="en" id="lang-en" aria-pressed="true" lang="en">EN</button>
        <button type="button" data-act="lang" data-lang="tr" id="lang-tr" aria-pressed="false" lang="tr">TR</button>
      </div>
    </div>
    <nav class="steps" id="steps" aria-label="Steps">
      <div class="wrap steps-in" id="nav"></div>
    </nav>
  </header>

  <div id="ectsbar" class="ectsbar" hidden></div>

  <main id="main" class="wrap" tabindex="-1">
    <noscript><p class="card">This planner needs JavaScript. / Bu planlayıcı JavaScript gerektirir.</p></noscript>
  </main>

  <footer class="foot">
    <div class="wrap"><p id="foot"></p></div>
  </footer>

  <div id="live" class="sr" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
